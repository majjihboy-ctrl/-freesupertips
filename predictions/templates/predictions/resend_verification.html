{% extends "predictions/base.html" %}

{% block title %}Resend Confirmation Email — Matchday Pro{% endblock %}

{% block content %}
<div class="auth-box">
    <h1>Resend Confirmation Email</h1>
    <form method="post">
        {% csrf_token %}
        <p>
            <label for="id_email">Email address</label>
            <input type="email" name="email" id="id_email" required>
        </p>
        <button type="submit" class="btn btn-green">Resend Link</button>
    </form>
    <div class="auth-switch">
        <a href="{% url 'login' %}">Back to login</a>
    </div>
</div>
{% endblock %}
