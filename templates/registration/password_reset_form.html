{% extends "predictions/base.html" %}

{% block title %}Reset Password — Matchday Pro{% endblock %}

{% block content %}
<div class="auth-box">
    <h1>Reset Password</h1>
    <p class="auth-intro">Enter your email address and we&apos;ll send you a link to reset your password.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-green">Send Reset Link</button>
    </form>
    <div class="auth-switch">
        Remembered it? <a href="{% url 'login' %}">Back to login</a>
    </div>
</div>
{% endblock %}
