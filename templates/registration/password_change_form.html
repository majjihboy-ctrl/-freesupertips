{% extends "predictions/base.html" %}

{% block title %}Change Password — Matchday Pro{% endblock %}

{% block content %}
<div class="auth-box">
    <h1>Change Password</h1>
    <p class="auth-intro">Enter your current password, then choose a new one.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-green">Update Password</button>
    </form>
    <div class="auth-switch">
        <a href="{% url 'home' %}">Back to home</a>
    </div>
</div>
{% endblock %}
